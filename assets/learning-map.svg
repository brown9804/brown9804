  <title id="title">From first lesson to hands-on practice</title>
  <desc id="desc">Six learning routes: Bicep or Terraform to Azure modules; DAX foundations to a practice model; machine learning and probability to image processing; assembly and Verilog to RISC-V on FPGA; LaTeX foundations to writing and slides; GH-300 concepts to study and practice. Use the linked resources below the diagram.</desc>
